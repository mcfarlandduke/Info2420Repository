<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Native Cooking of Utah</title>
    <link rel="stylesheet" href="mystyles.css">
    <style>
        body {
            text-align: center;
        }
        #splash-container {
            width: 760px;
            margin: 30px auto;
        }
        #splash-container h1 {
            text-align: center;
        }
        #splash-container p {
            text-align: center;
        }
        img[usemap] {
            border: none;
        }
    </style>
</head>
<body>

    <div id="splash-container">

        <h1>Native Cooking of Utah</h1>

        <p>Welcome &mdash; explore our site using the imagemap below.</p>

        <hr>

        <img src="Images/mymap.jpg"
             width="700" height="560"
             alt="Native Cooking of Utah site navigation imagemap with five areas: Home, About Us, Tributes, Survey, and Favorite Links"
             usemap="#siteMap">

        <map name="siteMap">
            <area shape="rect" coords="0,420,350,560"
                  href="Home.html"
                  title="Go to the Home page"
                  alt="Home">
            <area shape="rect" coords="350,420,700,560"
                  href="AboutUs.html"
                  title="Learn more About Us"
                  alt="About Us">
            <area shape="rect" coords="175,280,525,415"
                  href="Tributes.html"
                  title="Read customer Tributes"
                  alt="Tributes">
            <area shape="rect" coords="0,0,350,275"
                  href="Survey.html"
                  title="Take our Customer Survey"
                  alt="Survey">
            <area shape="rect" coords="350,0,700,275"
                  href="Links.html"
                  title="Browse our Favorite Links"
                  alt="Favorite Links">
        </map>

        <hr>

    </div>

</body>
</html>
