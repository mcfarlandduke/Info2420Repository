<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Native Cooking of Utah - Graphics</title>

<style type="text/css">

	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
		background: #FAEBD7;
		border: solid 1px #D2691E;
		padding: 5px;
	}

	#thumbs {
		margin-top: 10px;
	}

	#thumbs img {
		border: solid 1px #8B4513;
		margin: 5px;
		cursor: pointer;
	}

	#thumbs img:hover {
		border-color: #D2691E;
		opacity: 0.85;
	}

	#image {
		height: 320px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		padding: 10px;
	}

	#image img {
		max-height: 267px;
	}

	#bottomText {
		font-family: Georgia, serif;
		color: #8B4513;
		font-size: 1.1em;
		margin-top: 8px;
	}

	.instructions {
		font-style: italic;
	}

	#pageWrap {
		text-align: center;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image;
	PrintButton2 = new Image;
	logo1 = new Image;
	logo2 = new Image;

	if (document.images) {
		PrintButton1.src = "images/print5.gif";
		PrintButton2.src = "images/print6.gif";
		logo1.src = "images/logo1.jpg";
		logo2.src = "images/logo2.jpg";
	}

	var imgArray = new Array(
		'Image1Lg.jpg',
		'Image2Lg.jpg',
		'Image3Lg.jpg',
		'Image4Lg.jpg'
	);

	var titleArray = new Array(
		'Raspberry Cake',
		'Cherry Cheesecake',
		'Backyard Grill',
		'Jello Cake'
	);

	var imgPath = "images/fullsize/";

	function swapImage(imgID) {
		var theImage = document.getElementById('theImage');
		var textDiv  = document.getElementById('bottomText');
		theImage.src = imgPath + imgArray[imgID];
		textDiv.innerHTML = titleArray[imgID];
	}

	function preloadImages() {
		for (var i = 0; i < imgArray.length; i++) {
			var tmpImg = new Image;
			tmpImg.src = imgPath + imgArray[i];
		}
	}

</script>

</head>
<body onload="preloadImages()">

<div id="pageWrap">

	<!-- ═══ BANNER ═══════════════════════════════════════════════ -->
	<div>
		<img src="images/banner.png" alt="Native Cooking of Utah" style="max-width:900px;" />
	</div>

	<br />

	<!-- ═══ PRINT BUTTON ROLLOVER ════════════════════════════════ -->
	<div>
		<a href=""
		   onmouseover="document.PrintButton.src=PrintButton2.src;"
		   onmouseout="document.PrintButton.src=PrintButton1.src;">
			<img src="images/print5.gif"
			     width="200" height="50"
			     name="PrintButton"
			     alt="Print Page"
			     style="border:none;" />
		</a>
	</div>

	<br />

	<!-- ═══ LOGO ROLLOVER ════════════════════════════════════════ -->
	<div>
		<a href=""
		   onmouseover="document.logoImg.src=logo2.src;"
		   onmouseout="document.logoImg.src=logo1.src;">
			<img src="images/logo1.jpg"
			     width="130" height="165"
			     name="logoImg"
			     alt="Native Cooking of Utah Logo"
			     style="border:none;" />
		</a>
	</div>

	<br /><br />

	<!-- ═══ THUMBNAIL IMAGE SWAP ════════════════════════════════ -->
	<div id="thumbs">
		<p class="instructions">Hover over a thumbnail to see the full-size image below.</p>
		<img src="images/thumbnails/Image1Sm.jpg" alt="Raspberry Cake"    width="150" height="100" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/Image2Sm.jpg" alt="Cherry Cheesecake" width="150" height="100" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/Image3Sm.jpg" alt="Backyard Grill"    width="150" height="100" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/Image4Sm.jpg" alt="Jello Cake"        width="150" height="100" onmouseover="swapImage(3);" />
	</div>

	<div id="image">
		<img id="theImage" src="images/fullsize/Image1Lg.jpg" alt="Raspberry Cake" width="400" height="267" />
		<h3 id="bottomText">Raspberry Cake</h3>
	</div>

	<br />

	<!-- ═══ TWO-COLUMN BACKGROUND PREVIEW ═══════════════════════ -->
	<div>
		<img src="images/2colback.jpg" alt="Two-column background slice" style="width:960px; height:40px; display:block; margin:0 auto;" />
	</div>

	<br /><br />

</div><!-- /pageWrap -->

<p style="text-align:center;">
	<a href="http://validator.w3.org/check?uri=referer">
		<img src="http://www.w3.org/Icons/valid-xhtml10"
		     alt="Valid XHTML 1.0 Transitional"
		     height="31" width="88" />
	</a>
</p>

</body>
</html>
